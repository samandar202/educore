[package]
name = "educore"
version = "0.5.1"
edition = "2021"
default-run = "educore"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "derive", "migrate", "macros"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
dotenvy = "0.15"

chrono = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release.package.educore]
codegen-units = 1
